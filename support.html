  <style>
    .channel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      text-decoration: none;
      color: var(--ink);
      background: var(--paper);
      border: var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 18px 20px;
      margin-bottom: 16px;
      transition: transform .1s, box-shadow .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .channel:hover { transform: translate(3px,3px); box-shadow: 0 0 0 0 var(--ink); }
    .channel .name {
      font-family: "Archivo Black", sans-serif;
      font-size: 18px;
      text-transform: uppercase;
    }
    .channel .sub { font-size: 14px; font-weight: 500; word-break: break-all; }
    .channel .arrow { font-size: 22px; font-weight: 900; }
    .channel.venmo  { background: var(--main); }
    .channel.cash   { background: var(--lime); }
    .channel.coffee { background: var(--yellow); }
    .channel.wish   { background: var(--pink); }
