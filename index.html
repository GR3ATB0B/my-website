<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What The Nash!</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍌%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fef2e8;
    --main: #88aaee;
    --lime: #a3e636;
    --pink: #ffa6f6;
    --yellow: #fcd34d;
    --orange: #ffb15c;
    --mint: #7df2c8;
    --paper: #fff;
    --ink: #000;
    --border: 3px solid var(--ink);
    --shadow: 5px 5px 0 0 var(--ink);
    --shadow-sm: 3px 3px 0 0 var(--ink);
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "DM Sans", sans-serif;
    background: var(--bg);
    background-image:
      linear-gradient(rgba(0,0,0,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,.06) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--ink);
    min-height: 100dvh;
    padding: 28px 18px 48px;
  }
  .board { max-width: 760px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 26px; animation: drop .45s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes drop {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: none; }
  }
  .title-sticker {
    display: inline-block;
    background: var(--yellow);
    border: var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 22px 12px;
    transform: rotate(-1.5deg);
  }
  h1 {
    font-family: "Archivo Black", sans-serif;
    font-size: clamp(30px, 8vw, 48px);
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: -1px;
  }
  .tagline { font-size: 16px; font-weight: 700; margin-top: 14px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .tile {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
    text-align: center;
    text-decoration: none;
    color: var(--ink);
    background: var(--paper);
    border: var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 18px 10px;
    font-weight: 900;
    text-transform: uppercase;
    font-size: 14px;
    transition: transform .1s, box-shadow .1s;
    -webkit-tap-highlight-color: transparent;
  }
  .tile .emoji { font-size: 30px; }
  .tile:hover { transform: translate(3px,3px) rotate(-1deg); box-shadow: 0 0 0 0 var(--ink); }
  .tile:nth-child(4n+1) { transform: rotate(.7deg); }
  .tile:nth-child(4n+3) { transform: rotate(-.7deg); }
  .tile:nth-child(4n+1):hover, .tile:nth-child(4n+3):hover { transform: translate(3px,3px) rotate(0); }

  .grid.top { grid-template-columns: 1fr; }
  .tile.big {
    flex-direction: row;
    justify-content: flex-start;
    gap: 16px;
    text-align: left;
    padding: 22px 24px;
    font-size: 20px;
  }
  .tile.big .emoji { font-size: 40px; }
  .tile.big .label { display: flex; flex-direction: column; gap: 2px; }
  .tile.big small { font-weight: 500; text-transform: none; font-size: 13px; }
  .tile.big::after { content: "→"; margin-left: auto; font-size: 24px; }
  .tile.projects { background: var(--lime); }
  .tile.shed { background: var(--main); }
  .tile.hi { background: var(--pink); }

  .section-label {
    font-family: "Archivo Black", sans-serif;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 26px 0 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after { content: ""; flex: 1; border-top: 3px dashed var(--ink); }

  footer { text-align: center; font-size: 12.5px; font-weight: 500; margin-top: 34px; color: #333; }
  footer a { color: var(--ink); font-weight: 700; }
</style>
</head>
<body>

<div class="board">
  <header>
    <div class="title-sticker"><h1>🍌 What the Nash!</h1></div>
    <p class="tagline">I'm Nash. I build things. Pick a tile, see a thing.</p>
  </header>

  <div class="grid top">
    <a class="tile big projects" href="https://github.com/GR3ATB0B" target="_blank" rel="noopener">
      <span class="emoji">🛠️</span> <span class="label">My projects <small>all of them, on GitHub</small></span>
    </a>
    <a class="tile big shed" href="https://shed.whatthenash.com" target="_blank" rel="noopener">
      <span class="emoji">🚪</span> <span class="label">The shed <small>3D — walk around</small></span>
    </a>
    <a class="tile big hi" href="/reach.html">
      <span class="emoji">👋</span> <span class="label">Say hi <small>email &amp; socials</small></span>
    </a>
  </div>

  <div class="section-label">The hobbies</div>
  <div class="grid" id="hobbies"></div>

  <footer>© 2026 Nash · whatthenash.com · built with curiosity · <a href="https://github.com/GR3ATB0B" target="_blank" rel="noopener">GitHub</a></footer>
</div>

<script>
  const HOBBIES = [
    ["3d-printing","🖨️","3D Printing"], ["ai","🤖","AI"], ["camping","⛺","Camping"],
    ["coding","💻","Coding"], ["electronics","🔌","Electronics"], ["flower-making","🌸","Flower Making"],
    ["fly-fishing","🎣","Fly Fishing"], ["forging","⚒️","Forging"], ["lego","🧱","LEGO"],
    ["radio","📻","Radio"], ["math","➗","Math"], ["music","🎵","Music"],
    ["photography","📷","Photography"], ["rc","🛩️","RC"], ["reading","📚","Reading"],
    ["spanish-languages","🗣️","Spanish"], ["thrifting","🛍️","Thrifting"], ["weightlifting","🏋️","Weightlifting"]
  ];
  document.getElementById("hobbies").innerHTML = HOBBIES
    .map(([slug, emoji, name]) => `<a class="tile" href="/hobbies/${slug}.html"><span class="emoji">${emoji}</span>${name}</a>`)
    .join("");
</script>
</body>
</html>
